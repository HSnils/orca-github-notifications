name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Light checks that need no Orca install. `orca plugin validate/test/check` and `tsc` still run locally.
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest is valid JSON with a semver version
        run: |
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' orca-plugin.json
          jq -e '.id and .name and .main and .license' orca-plugin.json >/dev/null

      - name: Files named in the manifest exist
        run: |
          missing=0
          for f in $(jq -r '.main, (.contributes.panels[]?.entry)' orca-plugin.json); do
            [ -f "$f" ] || { echo "Missing file from manifest: $f" >&2; missing=1; }
          done
          exit $missing

      - name: No token-looking strings in the source
        run: |
          if grep -rEn 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_' --exclude-dir=.git --exclude=ci.yml .; then
            echo "Looks like a committed token" >&2
            exit 1
          fi
