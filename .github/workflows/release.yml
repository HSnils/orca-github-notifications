name: Release

# Push a tag like v0.2.0 (after bumping "version" in orca-plugin.json) to publish a GitHub Release.
# The notes are the commit subjects since the previous tag, plus a compare link.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must match the manifest version
        run: |
          manifest="$(jq -r .version orca-plugin.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match orca-plugin.json version $manifest" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..$GITHUB_REF_NAME"
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            else
              git log --no-merges --pretty='- %s' "$GITHUB_REF_NAME"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
